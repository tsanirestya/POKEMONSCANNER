name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📝 Create .env file
      run: |
        cat << 'EOF' > .env
        APP_NAME=PokemonScanner
        APP_ENV=production
        APP_KEY=base64:F0EuZKrFAE99IWkzj1D+yKbuAa94/Flx/fIvqGDeXv4=
        APP_DEBUG=false
        APP_URL=https://scanner.transentertainment.id
        LOG_CHANNEL=stack
        LOG_LEVEL=error
        DB_CONNECTION=mysql
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_DATABASE=${{ secrets.DB_DATABASE }}
        DB_USERNAME=${{ secrets.DB_USERNAME }}
        DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
        SESSION_DRIVER=database
        SESSION_LIFETIME=120
        QUEUE_CONNECTION=database
        CACHE_STORE=database
        EOF

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, mysql, sqlite

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: ⚙️ Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --no-ansi --no-interaction --no-progress

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: ⚙️ Build Assets
      run: |
        npm ci
        npm run build

    - name: 📁 Ensure runtime directories deploy
      run: |
        mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public
        find storage bootstrap/cache -type d -exec touch {}/.keep \;

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Note: If your FTP account roots directly to scanner.transentertainment.id, server-dir should be './'
        # Otherwise, adjust it to point to your subdomain root directory (e.g., 'public_html/scanner.transentertainment.id/')
        server-dir: ./
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          phpunit.xml
