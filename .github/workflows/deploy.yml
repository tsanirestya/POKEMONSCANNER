name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, mysql, sqlite

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: ⚙️ Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --no-ansi --no-interaction --no-progress

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: ⚙️ Build Assets
      run: |
        npm ci
        npm run build

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Note: If your FTP account roots directly to scanner.transentertainment.id, server-dir should be './'
        # Otherwise, adjust it to point to your subdomain root directory (e.g., 'public_html/scanner.transentertainment.id/')
        server-dir: ./
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          phpunit.xml
